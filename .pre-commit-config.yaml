# `commit-msg` matters as much as `pre-commit` here: the history already carries
# eleven commits whose message was pasted `git status` output, and only a
# commit-msg hook can catch that. `make hooks` installs both.
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Local so it runs inside the project venv and sees the real dependency types.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy app tests'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      # Standard library only, so it runs before any environment exists and adds
      # no measurable time to a commit.
      - id: commit-message
        name: Conventional Commit message
        entry: python backend/scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
