[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The database URL is read from Settings in migrations/env.py so migrations and the
# application can never drift onto different databases. Intentionally left blank.
sqlalchemy.url =

# Timestamped, slugged revision filenames sort chronologically in the directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships as a standalone binary, so it is
# not resolvable through the console_scripts entry-point table.
hooks = ruff_fix,ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
