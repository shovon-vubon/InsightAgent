[project]
name = "insightagent-backend"
version = "0.1.0"
description = "InsightAgent backend — autonomous AI research and data analysis agent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "openai>=1.60",
    "anthropic>=0.45",
    # --- knowledge base (Phase 3) ---
    "pgvector>=0.3.6",
    "python-multipart>=0.0.20",
    "arq>=0.26",
    "tiktoken>=0.8",
    # Document extraction. pypdf (BSD) and pdfplumber (MIT) rather than PyMuPDF,
    # which is AGPL-3.0 and would infect a permissively licensed repository.
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "charset-normalizer>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=5.0.0",
    # Reading docker-compose.yml in the worker healthcheck test. Present
    # transitively via uvicorn[standard], but a test that imports it should say so.
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    # `.pre-commit-config.yaml` shipped in Phase 1 but was never installable from
    # the project toolchain, so the hooks were never installed and none of the
    # gates below ran locally. `make hooks` now provisions them.
    "pre-commit>=4.0",
]

# Not a distributable package: the app is run from this directory (uvicorn app.main:app)
# and copied wholesale into the image. Avoids a build backend we would never use.
[tool.uv]
package = false

# ---------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async correctness
    "S",         # bandit security
    "T20",       # no print statements (brief §27)
    "RUF",
]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and hardcoded test credentials are fine
"migrations/**" = ["N999", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
    "asyncpg.*",
    "pdfplumber.*",
    "docx.*",
    "openpyxl.*",
    # Test-only: generates the PDF fixture for the Phase 3 acceptance test.
    "reportlab.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests must share one loop. Session-scoped fixtures (the engine, the
# Redis client) hold connections bound to the loop that created them; with the
# default per-function test loop those connections are used from a different loop
# and fail with "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL and Redis",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
